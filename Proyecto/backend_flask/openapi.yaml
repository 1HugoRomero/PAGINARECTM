components:
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - codigo
          - mensaje
          properties:
            codigo:
              type: string
            mensaje:
              type: string
            modulo:
              type: string
            operacion:
              type: string
  securitySchemes:
    gatewayAuth:
      type: apiKey
      in: header
      name: X-AgroAsesor-Signature
      description: Firma HMAC-SHA256 generada por Django junto con X-AgroAsesor-User, -Staff y -Timestamp. No es
        una credencial de navegador.
