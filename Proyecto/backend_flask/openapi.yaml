  /calculos:
    get:
      tags:
      - Cálculos
      summary: Historial de cálculos del usuario
      description: 'Solo lectura. Filtros opcionales: potrero_id, limite (1-200).'
      security: *id001
      parameters:
      - name: potrero_id
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema:
                type: object
              example:
                calculos:
                - id: 1
                  operacion: semillas
                  potrero_id: 1
                  potrero: Norte
                  creado: '2026-10-02 09:00:00'
                  entrada:
                    ha: 1.5
                  resultado:
                    kg: 270
        '401':
          description: Sin autenticación válida o firma vencida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: NO_AUTENTICADO
                  mensaje: Falta autenticación válida.
        '503':
          description: Base de datos o clave interna no configuradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: AUTENTICACION_NO_CONFIGURADA
                  mensaje: La API no tiene configurada la clave interna.
      x-fuente-datos: Base de datos oficial de AgroAsesor (Django), abierta en modo solo lectura y filtrada por
