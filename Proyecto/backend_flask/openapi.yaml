        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fertilizante_id
              - nutriente
              - requerimiento_kg_ha
              properties:
                fertilizante_id:
                  type: string
                  example: superfosfato-triple
                nutriente:
                  type: string
                  enum:
                  - N
                  - P2O5
                  - K2O
                  - Mg
                  - S
                  example: P2O5
                requerimiento_kg_ha:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 2000
                  example: 92
                superficie_ha:
                  type: number
                  exclusiveMinimum: 0
                  example: 1.5
                superficie_m2:
                  type: number
                  exclusiveMinimum: 0
                ley_declarada_pct:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100
                  description: Porcentaje del nutriente que declara la etiqueta
                peso_saco_kg:
                  type: number
                  exclusiveMinimum: 0
                  example: 25
              additionalProperties: false
            example:
              fertilizante_id: urea
              nutriente: N
              requerimiento_kg_ha: 92
              superficie_ha: 2
              peso_saco_kg: 25
      responses:
        '200':
          description: Producto por hectárea, total, aportes de otros nutrientes y sacos
          content:
            application/json:
              schema:
                type: object
              example:
                fertilizante:
                  id: urea
                  nombre: Urea
                nutriente: N
                requerimiento_kg_ha: 92
                superficie_ha: 2.0
                ley:
                  tipo: referencial
                  valor_pct: 45–46
                  min_pct: 45
                  max_pct: 46
                formula: producto_kg_ha = requerimiento_kg_ha × 100 / ley_%; total_kg = producto_kg_ha × superficie_ha
